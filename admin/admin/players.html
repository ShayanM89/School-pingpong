<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت بازیکنان | مسابقات پینگ پنگ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .admin-badge {
      background: #2563eb;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #6b7280;
      font-size: 14px;
    }

    .add-button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }

    .form-card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
      margin-bottom: 25px;
      display: none;
    }

    .form-card.show {
      display: block;
    }

    .form-card h2 {
      font-size: 19px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: bold;
    }

    .form-group input {
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .form-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-save {
      background: #16a34a;
      color: white;
    }

    .btn-cancel {
      background: #e5e7eb;
      color: #111827;
    }

    .players-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
      overflow-x: auto;
    }

    .players-card h2 {
      font-size: 19px;
      margin-bottom: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th {
      background: #f3f4f6;
      padding: 13px;
      text-align: right;
      font-size: 13px;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
    }

    .empty-message {
      text-align: center;
      padding: 30px 10px;
      color: #6b7280;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .back-links {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-link {
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 13px;
    }

    footer {
      margin-top: 50px;
      background: #111827;
      color: #d1d5db;
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
      line-height: 2;
    }

    @media (max-width: 700px) {

      .header-inner {
        flex-direction: column;
        text-align: center;
      }

      .top-section {
        flex-direction: column;
        align-items: stretch;
      }

      .add-button {
        text-align: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <div class="logo">🏓 پنل مدیریت مسابقات</div>
      <div class="admin-badge">مدیریت بازیکنان</div>
    </div>
  </header>

  <main>

    <div class="top-section">

      <div class="page-title">
        <h1>مدیریت بازیکنان</h1>
        <p>از این بخش می‌توانید بازیکنان مسابقات را مدیریت کنید.</p>
      </div>

      <button class="add-button" onclick="showForm()">
        ➕ افزودن بازیکن
      </button>

    </div>

    <!-- فرم افزودن بازیکن -->
    <div class="form-card" id="playerForm">

      <h2>افزودن بازیکن جدید</h2>

      <div class="form-grid">

        <div class="form-group">
          <label for="playerName">نام و نام خانوادگی</label>
          <input
            type="text"
            id="playerName"
            placeholder="مثلاً: علی رضایی"
          >
        </div>

        <div class="form-group">
          <label for="playerClass">کلاس</label>
          <input
            type="text"
            id="playerClass"
            placeholder="مثلاً: ۹/۲"
          >
        </div>

      </div>

      <div class="form-actions">

        <button class="btn btn-save" onclick="addPlayer()">
          ذخیره بازیکن
        </button>

        <button class="btn btn-cancel" onclick="hideForm()">
          انصراف
        </button>

      </div>

    </div>

    <!-- جدول بازیکنان -->
    <div class="players-card">

      <h2>لیست بازیکنان</h2>

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>نام بازیکن</th>
            <th>کلاس</th>
            <th>تعداد برد</th>
            <th>تعداد باخت</th>
            <th>عملیات</th>
          </tr>
        </thead>

        <tbody id="playersTable">

          <!--
            فعلاً خالی است.
            بعداً اطلاعات از دیتابیس خوانده می‌شود.
          -->

        </tbody>

      </table>

      <div class="empty-message" id="emptyMessage">
        هنوز بازیکنی ثبت نشده است.
      </div>

    </div>

    <div class="back-links">

      <a href="index.html" class="back-link">
        ← پنل مدیریت
      </a>

      <a href="../index.html" class="back-link">
        🏠 صفحه اصلی
      </a>

    </div>

  </main>

  <footer>
    <div>© شایان محمدی</div>
    <div>Created by SHM89</div>
  </footer>


  <script>

    function showForm() {
      document.getElementById("playerForm").classList.add("show");
      document.getElementById("playerName").focus();
    }

    function hideForm() {
      document.getElementById("playerForm").classList.remove("show");

      document.getElementById("playerName").value = "";
      document.getElementById("playerClass").value = "";
    }

    function addPlayer() {

      const name = document.getElementById("playerName").value.trim();
      const playerClass = document.getElementById("playerClass").value.trim();

      if (name === "") {
        alert("لطفاً نام بازیکن را وارد کنید.");
        return;
      }

      const table = document.getElementById("playersTable");

      const row = table.insertRow();

      row.insertCell(0).innerText = table.rows.length;
      row.insertCell(1).innerText = name;
      row.insertCell(2).innerText = playerClass || "-";
      row.insertCell(3).innerText = "0";
      row.insertCell(4).innerText = "0";

      const actionCell = row.insertCell(5);

      const deleteButton = document.createElement("button");

      deleteButton.innerText = "حذف";
      deleteButton.className = "delete-btn";

      deleteButton.onclick = function() {
        if (confirm("آیا از حذف این بازیکن مطمئن هستید؟")) {
          row.remove();
          updateEmptyMessage();
        }
      };

      actionCell.appendChild(deleteButton);

      hideForm();
      updateEmptyMessage();
    }

    function updateEmptyMessage() {

      const table = document.getElementById("playersTable");
      const message = document.getElementById("emptyMessage");

      if (table.rows.length === 0) {
        message.style.display = "block";
      } else {
        message.style.display = "none";
      }
    }

  </script>

</body>
</html>
