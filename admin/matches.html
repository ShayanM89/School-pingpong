<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مدیریت مسابقات | پینگ پونگ مدرسه</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .create-button {
            background: #2563eb;
            color: white;
        }

        .refresh-button {
            background: #059669;
            color: white;
        }

        .back-button {
            background: #6b7280;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 18px;
            background: #e5e7eb;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            color: #555;
            font-size: 15px;
        }

        .stat-card strong {
            font-size: 28px;
            color: #111827;
        }

        .matches-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .matches-box h2 {
            margin-top: 0;
        }

        .match-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .match-number {
            font-weight: bold;
            color: #374151;
        }

        .status {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            background: #dbeafe;
            color: #1e40af;
        }

        .status.finished {
            background: #dcfce7;
            color: #166534;
        }

        .status.cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .players {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .player {
            font-size: 17px;
            font-weight: bold;
        }

        .vs {
            color: #6b7280;
            font-weight: bold;
        }

        .score-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .score-form {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .score-form input {
            width: 70px;
            padding: 9px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            text-align: center;
            font-size: 16px;
        }

        .save-button {
            background: #16a34a;
            color: white;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 30px 10px;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 30px 10px;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .players {
                grid-template-columns: 1fr;
                gap: 7px;
            }

            .vs {
                display: none;
            }

            .match-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .top-actions {
                flex-direction: column;
            }

            .top-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏓 مدیریت مسابقات پینگ پونگ</h1>
</header>

<div class="container">

    <div class="top-actions">

        <button
            type="button"
            class="create-button"
            onclick="createMissingMatches()"
        >
            ➕ ایجاد مسابقات جدید
        </button>

        <button
            type="button"
            class="refresh-button"
            onclick="loadMatches()"
        >
            🔄 بروزرسانی
        </button>

        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ↩️ بازگشت به پنل مدیریت
        </button>

    </div>

    <div id="message" class="message"></div>

    <div class="stats">

        <div class="stat-card">
            <h3>تعداد بازیکنان فعال</h3>
            <strong id="playersCount">0</strong>
        </div>

        <div class="stat-card">
            <h3>کل مسابقات</h3>
            <strong id="matchesCount">0</strong>
        </div>

        <div class="stat-card">
            <h3>مسابقات انجام‌شده</h3>
            <strong id="finishedCount">0</strong>
        </div>

    </div>

    <div class="matches-box">

        <h2>📋 فهرست مسابقات</h2>

        <div id="matchesList">
            <div class="empty">
                در حال دریافت اطلاعات...
            </div>
        </div>

    </div>

</div>

<footer>
    © شایان محمدی<br>
    Created by SHM89
</footer>

<script>

let players = [];
let matches = [];

async function checkLogin() {

    const {
        data: { session }
    } = await window.supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "../login.html";
        return false;
    }

    return true;
}

function showMessage(text, type = "info") {

    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "message show " + type;

}

async function loadPlayers() {

    const { data, error } = await window.supabaseClient
        .from("players")
        .select("id, name, class_name, is_active")
        .eq("is_active", true)
        .order("name", { ascending: true });

    if (error) {
        throw error;
    }

    players = data || [];

    document.getElementById("playersCount").textContent =
        players.length;
}

async function loadMatches() {

    try {

        const loggedIn = await checkLogin();

        if (!loggedIn) {
            return;
        }

        await loadPlayers();

        const { data, error } = await window.supabaseClient
            .from("matches")
            .select(`
                id,
                player1_id,
                player2_id,
                player1_score,
                player2_score,
                status,
                played_at,
                created_at
            `)
            .order("id", { ascending: true });

        if (error) {
            throw error;
        }

        matches = data || [];

        document.getElementById("matchesCount").textContent =
            matches.length;

        document.getElementById("finishedCount").textContent =
            matches.filter(match => match.status === "finished").length;

        renderMatches();

    } catch (error) {

        console.error(error);

        showMessage(
            "خطا در دریافت مسابقات: " + error.message,
            "error"
        );

        document.getElementById("matchesList").innerHTML = `
            <div class="empty">
                دریافت اطلاعات مسابقات با خطا مواجه شد.
            </div>
        `;
    }
}

function getPlayerName(playerId) {

    const player = players.find(
        p => Number(p.id) === Number(playerId)
    );

    if (player) {
        return player.name;
    }

    return "بازیکن حذف‌شده";
}

function renderMatches() {

    const container = document.getElementById("matchesList");

    if (!matches.length) {

        container.innerHTML = `
            <div class="empty">
                هنوز هیچ مسابقه‌ای در سیستم ثبت نشده است.
                <br><br>
                برای ساخت مسابقات روی «ایجاد مسابقات جدید» بزنید.
            </div>
        `;

        return;
    }

    container.innerHTML = matches.map((match, index) => {

        const player1Name = getPlayerName(match.player1_id);
        const player2Name = getPlayerName(match.player2_id);

        let statusText = "برنامه‌ریزی‌شده";

        if (match.status === "finished") {
            statusText = "انجام‌شده";
        }

        if (match.status === "cancelled") {
            statusText = "لغوشده";
        }

        const statusClass =
            match.status === "finished"
                ? "finished"
                : match.status === "cancelled"
                    ? "cancelled"
                    : "";

        const finished =
            match.status === "finished";

        return `
            <div class="match-card">

                <div class="match-header">

                    <span class="match-number">
                        مسابقه ${index + 1}
                    </span>

                    <span class="status ${statusClass}">
                        ${statusText}
                    </span>

                </div>

                <div class="players">

                    <div class="player">
                        ${player1Name}
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="player">
                        ${player2Name}
                    </div>

                </div>

                <div class="score-area">

                    ${
                        finished
                        ? `
                            <div class="score-form">

                                <strong>
                                    ${match.player1_score}
                                </strong>

                                <span>
                                    -
                                </span>

                                <strong>
                                    ${match.player2_score}
                                </strong>

                                <button
                                    type="button"
                                    class="edit-button"
                                    onclick="editFinishedMatch(${match.id})"
                                >
                                    ✏️ ویرایش نتیجه
                                </button>

                            </div>
                        `
                        : `
                            <div class="score-form">

                                <input
                                    type="number"
                                    min="0"
                                    id="score1-${match.id}"
                                    placeholder="امتیاز"
                                >

                                <span>
                                    -
                                </span>

                                <input
                                    type="number"
                                    min="0"
                                    id="score2-${match.id}"
                                    placeholder="امتیاز"
                                >

                                <button
                                    type="button"
                                    class="save-button"
                                    onclick="saveResult(${match.id})"
                                >
                                    💾 ثبت نتیجه
                                </button>

                            </div>
                        `
                    }

                </div>

            </div>
        `;

    }).join("");
}
  <script>

async function createMissingMatches() {

    try {

        const loggedIn = await checkLogin();

        if (!loggedIn) {
            return;
        }

        showMessage(
            "در حال بررسی مسابقات موجود و ایجاد مسابقات جدید...",
            "info"
        );

        await loadPlayers();

        if (players.length < 2) {

            showMessage(
                "برای ایجاد مسابقه حداقل باید ۲ بازیکن فعال داشته باشید.",
                "error"
            );

            return;
        }

        const { data: existingMatches, error } =
            await window.supabaseClient
                .from("matches")
                .select("player1_id, player2_id");

        if (error) {
            throw error;
        }

        const existingPairs = new Set();

        (existingMatches || []).forEach(match => {

            const a = Number(match.player1_id);
            const b = Number(match.player2_id);

            const key = a < b
                ? `${a}-${b}`
                : `${b}-${a}`;

            existingPairs.add(key);

        });

        const newMatches = [];

        for (let i = 0; i < players.length; i++) {

            for (let j = i + 1; j < players.length; j++) {

                const player1 = players[i];
                const player2 = players[j];

                const a = Number(player1.id);
                const b = Number(player2.id);

                const key = a < b
                    ? `${a}-${b}`
                    : `${b}-${a}`;

                /*
                 * اگر این دو بازیکن قبلاً با هم مسابقه داده باشند،
                 * هیچ رکورد جدیدی ساخته نمی‌شود.
                 */
                if (existingPairs.has(key)) {
                    continue;
                }

                newMatches.push({
                    player1_id: a,
                    player2_id: b,
                    status: "scheduled"
                });

            }

        }

        if (newMatches.length === 0) {

            showMessage(
                "همه مسابقات لازم قبلاً ایجاد شده‌اند و چیزی برای اضافه کردن وجود ندارد.",
                "info"
            );

            await loadMatches();

            return;
        }

        const { data: insertedMatches, error: insertError } =
            await window.supabaseClient
                .from("matches")
                .insert(newMatches)
                .select();

        if (insertError) {
            throw insertError;
        }

        const createdCount =
            insertedMatches ? insertedMatches.length : newMatches.length;

        showMessage(
            `${createdCount} مسابقه جدید با موفقیت ایجاد شد.`,
            "success"
        );

        await loadMatches();

    } catch (error) {

        console.error(
            "CREATE MATCHES ERROR:",
            error
        );

        showMessage(
            "خطا در ایجاد مسابقات: " + error.message,
            "error"
        );

    }

}


async function saveResult(matchId) {

    try {

        const score1Input =
            document.getElementById(`score1-${matchId}`);

        const score2Input =
            document.getElementById(`score2-${matchId}`);

        if (!score1Input || !score2Input) {

            showMessage(
                "قسمت وارد کردن نتیجه پیدا نشد.",
                "error"
            );

            return;
        }

        const score1Text =
            score1Input.value.trim();

        const score2Text =
            score2Input.value.trim();

        if (score1Text === "" || score2Text === "") {

            showMessage(
                "لطفاً امتیاز هر دو بازیکن را وارد کنید.",
                "error"
            );

            return;
        }

        const score1 = Number(score1Text);
        const score2 = Number(score2Text);

        if (
            !Number.isInteger(score1) ||
            !Number.isInteger(score2) ||
            score1 < 0 ||
            score2 < 0
        ) {

            showMessage(
                "امتیازها باید عدد صحیح صفر یا بیشتر باشند.",
                "error"
            );

            return;
        }

        if (score1 === score2) {

            showMessage(
                "نتیجه مساوی قابل ثبت نیست؛ باید یک برنده مشخص باشد.",
                "error"
            );

            return;
        }

        const { error } =
            await window.supabaseClient
                .from("matches")
                .update({
                    player1_score: score1,
                    player2_score: score2,
                    status: "finished",
                    played_at: new Date().toISOString()
                })
                .eq("id", matchId);

        if (error) {
            throw error;
        }

        showMessage(
            "نتیجه مسابقه با موفقیت ثبت شد.",
            "success"
        );

        await loadMatches();

    } catch (error) {

        console.error(
            "SAVE RESULT ERROR:",
            error
        );

        showMessage(
            "خطا در ثبت نتیجه: " + error.message,
            "error"
        );

    }

}


async function editFinishedMatch(matchId) {

    const match =
        matches.find(
            item => Number(item.id) === Number(matchId)
        );

    if (!match) {

        showMessage(
            "مسابقه موردنظر پیدا نشد.",
            "error"
        );

        return;
    }

    const currentScore1 =
        match.player1_score ?? "";

    const currentScore2 =
        match.player2_score ?? "";

    const score1Text = prompt(
        `امتیاز ${getPlayerName(match.player1_id)} را وارد کنید:`,
        currentScore1
    );

    if (score1Text === null) {
        return;
    }

    const score2Text = prompt(
        `امتیاز ${getPlayerName(match.player2_id)} را وارد کنید:`,
        currentScore2
    );

    if (score2Text === null) {
        return;
    }

    const score1 = Number(score1Text);
    const score2 = Number(score2Text);

    if (
        !Number.isInteger(score1) ||
        !Number.isInteger(score2) ||
        score1 < 0 ||
        score2 < 0
    ) {

        showMessage(
            "امتیازها باید عدد صحیح صفر یا بیشتر باشند.",
            "error"
        );

        return;
    }

    if (score1 === score2) {

        showMessage(
            "نتیجه مساوی قابل ثبت نیست.",
            "error"
        );

        return;
    }

    try {

        const { error } =
            await window.supabaseClient
                .from("matches")
                .update({
                    player1_score: score1,
                    player2_score: score2,
                    status: "finished",
                    played_at: new Date().toISOString()
                })
                .eq("id", matchId);

        if (error) {
            throw error;
        }

        showMessage(
            "نتیجه با موفقیت ویرایش شد.",
            "success"
        );

        await loadMatches();

    } catch (error) {

        console.error(
            "EDIT RESULT ERROR:",
            error
        );

        showMessage(
            "خطا در ویرایش نتیجه: " + error.message,
            "error"
        );

    }

                      }
  window.addEventListener("DOMContentLoaded", async () => {

    const loggedIn = await checkLogin();

    if (!loggedIn) {
        return;
    }

    await loadMatches();

});

</script>

</body>
</html>
