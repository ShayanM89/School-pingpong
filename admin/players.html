<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت بازیکنان | مسابقات پینگ پونگ</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .admin-badge {
      background: #2563eb;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #6b7280;
      font-size: 14px;
    }

    .add-button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-button:hover {
      background: #1d4ed8;
    }

    .form-card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      margin-bottom: 25px;
      display: none;
    }

    .form-card.show {
      display: block;
    }

    .form-card h2 {
      font-size: 19px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: bold;
    }

    .form-group input {
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .form-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-save {
      background: #16a34a;
      color: white;
    }

    .btn-save:hover {
      background: #15803d;
    }

    .btn-cancel {
      background: #e5e7eb;
      color: #111827;
    }

    .players-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      overflow-x: auto;
    }

    .players-card h2 {
      font-size: 19px;
      margin-bottom: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th {
      background: #f3f4f6;
      padding: 13px;
      text-align: right;
      font-size: 13px;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
    }

    .empty-message {
      text-align: center;
      padding: 30px 10px;
      color: #6b7280;
      display: none;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .status-message {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-links {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-link {
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 13px;
    }

    footer {
      margin-top: 50px;
      background: #111827;
      color: #d1d5db;
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
      line-height: 2;
    }

    @media (max-width: 700px) {

      .header-inner {
        flex-direction: column;
        text-align: center;
      }

      .top-section {
        flex-direction: column;
        align-items: stretch;
      }

      .add-button {
        text-align: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      🏓 پنل مدیریت مسابقات
    </div>

    <div class="admin-badge">
      مدیریت بازیکنان
    </div>

  </div>
</header>


<main>

  <div class="top-section">

    <div class="page-title">

      <h1>مدیریت بازیکنان</h1>

      <p>
        از این بخش می‌توانید بازیکنان مسابقات را مدیریت کنید.
      </p>

    </div>

    <button class="add-button" onclick="showForm()">
      ➕ افزودن بازیکن
    </button>

  </div>


  <div id="statusMessage" class="status-message"></div>


  <div class="form-card" id="playerForm">

    <h2>
      افزودن بازیکن جدید
    </h2>

    <div class="form-grid">

      <div class="form-group">

        <label for="playerName">
          نام و نام خانوادگی
        </label>

        <input
          type="text"
          id="playerName"
          placeholder="مثلاً: علی رضایی"
        >

      </div>


      <div class="form-group">

        <label for="playerClass">
          کلاس
        </label>

        <input
          type="text"
          id="playerClass"
          placeholder="مثلاً: ۱۰/۲"
        >

      </div>

    </div>


    <div class="form-actions">

      <button
        class="btn btn-save"
        id="saveButton"
        onclick="addPlayer()"
      >
        ذخیره بازیکن
      </button>

      <button
        class="btn btn-cancel"
        onclick="hideForm()"
      >
        انصراف
      </button>

    </div>

  </div>


  <div class="players-card">

    <h2>
      لیست بازیکنان
    </h2>

    <table>

      <thead>

        <tr>
          <th>#</th>
          <th>نام بازیکن</th>
          <th>کلاس</th>
          <th>تعداد برد</th>
          <th>تعداد باخت</th>
          <th>عملیات</th>
        </tr>

      </thead>

      <tbody id="playersTable">
      </tbody>

    </table>


    <div
      class="empty-message"
      id="emptyMessage"
    >
      هنوز بازیکنی ثبت نشده است.
    </div>

  </div>


  <div class="back-links">

    <a
      href="index.html"
      class="back-link"
    >
      ← پنل مدیریت
    </a>

    <a
      href="../index.html"
      class="back-link"
    >
      🏠 صفحه اصلی
    </a>

  </div>

</main>


<footer>

  <div>
    © شایان محمدی
  </div>

  <div>
    Created by SHM89
  </div>

</footer>


<script>

let players = [];


/* =========================
   بررسی ورود مدیر
========================= */

async function checkAuth() {

  const {
    data,
    error
  } = await window.supabaseClient.auth.getSession();

  if (error || !data.session) {

    window.location.href = "../login.html";

    return false;
  }

  return true;
}


/* =========================
   نمایش فرم
========================= */

function showForm() {

  document
    .getElementById("playerForm")
    .classList.add("show");

  document
    .getElementById("playerName")
    .focus();
}


/* =========================
   مخفی کردن فرم
========================= */

function hideForm() {

  document
    .getElementById("playerForm")
    .classList.remove("show");

  document
    .getElementById("playerName")
    .value = "";

  document
    .getElementById("playerClass")
    .value = "";
}


/* =========================
   پیام
========================= */

function showMessage(text, type) {

  const box =
    document.getElementById("statusMessage");

  box.textContent = text;

  box.className =
    "status-message " + type;

  box.style.display = "block";

  setTimeout(function () {

    box.style.display = "none";

  }, 3500);
}


/* =========================
   دریافت بازیکنان
========================= */

async function loadPlayers() {

  const table =
    document.getElementById("playersTable");

  const empty =
    document.getElementById("emptyMessage");

  table.innerHTML = "";

  const {
    data,
    error
  } = await window.supabaseClient
    .from("players")
    .select("*")
    .eq("is_active", true)
    .order("id", {
      ascending: true
    });


  if (error) {

    console.error(error);

    showMessage(
      "خطا در دریافت بازیکنان: " + error.message,
      "error"
    );

    return;
  }


  players = data || [];


  if (players.length === 0) {

    empty.style.display = "block";

    return;

  }


  empty.style.display = "none";


  for (
    let i = 0;
    i < players.length;
    i++
  ) {

    const player = players[i];

    await createPlayerRow(
      player,
      i + 1
    );

  }

}


/* =========================
   ساخت ردیف بازیکن
========================= */

async function createPlayerRow(
  player,
  number
) {

  const table =
    document.getElementById("playersTable");

  const row =
    table.insertRow();


  row.insertCell(0).innerText =
    number;


  row.insertCell(1).innerText =
    player.name;


  row.insertCell(2).innerText =
    player.class_name || "-";


  const stats =
    await getPlayerStats(player.id);


  row.insertCell(3).innerText =
    stats.wins;


  row.insertCell(4).innerText =
    stats.losses;


  const actionCell =
    row.insertCell(5);


  const deleteButton =
    document.createElement("button");


  deleteButton.className =
    "delete-btn";


  deleteButton.innerText =
    "غیرفعال کردن";


  deleteButton.onclick =
    function () {

      deactivatePlayer(
        player.id,
        player.name
      );

    };


  actionCell.appendChild(
    deleteButton
  );

}


/* =========================
   محاسبه برد و باخت
========================= */

async function getPlayerStats(playerId) {

  const {
    data,
    error
  } = await window.supabaseClient
    .from("matches")
    .select(
      "player1_id, player2_id, player1_score, player2_score, status"
    )
    .or(
      "player1_id.eq." +
      playerId +
      ",player2_id.eq." +
      playerId
    )
    .eq(
      "status",
      "finished"
    );


  if (error) {

    console.error(error);

    return {
      wins: 0,
      losses: 0
    };

  }


  let wins = 0;
  let losses = 0;


  for (const match of data || []) {

    if (
      match.player1_score === null ||
      match.player2_score === null
    ) {
      continue;
    }


    if (
      match.player1_id === playerId
    ) {

      if (
        match.player1_score >
        match.player2_score
      ) {

        wins++;

      } else if (
        match.player1_score <
        match.player2_score
      ) {

        losses++;

      }

    }


    if (
      match.player2_id === playerId
    ) {

      if (
        match.player2_score >
        match.player1_score
      ) {

        wins++;

      } else if (
        match.player2_score <
        match.player1_score
      ) {

        losses++;

      }

    }

  }


  return {
    wins,
    losses
  };

}


/* =========================
   افزودن بازیکن
========================= */

async function addPlayer() {

  const name =
    document
      .getElementById("playerName")
      .value
      .trim();


  const playerClass =
    document
      .getElementById("playerClass")
      .value
      .trim();


  if (name === "") {

    alert(
      "لطفاً نام بازیکن را وارد کنید."
    );

    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled = true;

  saveButton.innerText =
    "در حال ذخیره...";


  const {
    data,
    error
  } = await window.supabaseClient
    .from("players")
    .insert([
      {
        name: name,
        class_name:
          playerClass || null,
        is_active: true
      }
    ])
    .select();


  saveButton.disabled = false;

  saveButton.innerText =
    "ذخیره بازیکن";


  if (error) {

    console.error(error);

    showMessage(
      "خطا در ذخیره بازیکن: " +
      error.message,
      "error"
    );

    return;

  }


  showMessage(
    "بازیکن با موفقیت اضافه شد. ✅",
    "success"
  );


  hideForm();


  await loadPlayers();

}


/* =========================
   غیرفعال کردن بازیکن
========================= */

async function deactivatePlayer(
  playerId,
  playerName
) {

  const confirmed =
    confirm(
      "آیا مطمئن هستید که می‌خواهید «" +
      playerName +
      "» را غیرفعال کنید؟\n\n" +
      "تاریخچه مسابقات او حفظ خواهد شد."
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await window.supabaseClient
    .from("players")
    .update({
      is_active: false
    })
    .eq(
      "id",
      playerId
    );


  if (error) {

    console.error(error);

    showMessage(
      "خطا در غیرفعال کردن بازیکن: " +
      error.message,
      "error"
    );

    return;

  }


  showMessage(
    "بازیکن غیرفعال شد. ✅",
    "success"
  );


  await loadPlayers();

}


/* =========================
   شروع صفحه
========================= */

async function init() {

  const authenticated =
    await checkAuth();


  if (!authenticated) {
    return;
  }


  await loadPlayers();

}


init();

</script>

</body>
</html>
