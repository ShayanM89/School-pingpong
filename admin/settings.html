<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تنظیمات | مسابقات پینگ پونگ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .badge {
      background: #2563eb;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .title p {
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .info {
      background: #eff6ff;
      color: #1e40af;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 2;
      margin-bottom: 18px;
    }

    .save-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
    }

    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .link-btn {
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 13px;
    }

    footer {
      margin-top: 50px;
      background: #111827;
      color: #d1d5db;
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
      line-height: 2;
    }

    @media (max-width: 700px) {
      .header-inner {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      .title h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">🏓 پنل مدیریت مسابقات</div>
    <div class="badge">تنظیمات</div>
  </div>
</header>

<main>

  <div class="title">
    <h1>⚙️ تنظیمات مسابقات</h1>
    <p>تنظیمات کلی مسابقات پینگ پونگ را مدیریت کنید.</p>
  </div>

  <div class="card">

    <h2>اطلاعات مسابقات</h2>

    <div class="form-group">
      <label for="competitionName">
        نام مسابقات
      </label>

      <input
        type="text"
        id="competitionName"
        value="مسابقات پینگ پونگ مدرسه"
      >
    </div>

    <div class="form-group">

      <label for="competitionType">
        نوع مسابقات
      </label>

      <select id="competitionType">

        <option value="league">
          لیگ
        </option>

        <option value="knockout">
          حذفی
        </option>

      </select>

    </div>

    <div class="form-group">

      <label for="winPoints">
        امتیاز برد
      </label>

      <input
        type="number"
        id="winPoints"
        value="3"
        min="0"
      >

    </div>

    <div class="form-group">

      <label for="lossPoints">
        امتیاز باخت
      </label>

      <input
        type="number"
        id="lossPoints"
        value="0"
        min="0"
      >

    </div>

    <div class="info">
      💡 در حالت لیگ، امتیاز بازیکنان بر اساس نتایج مسابقات
      محاسبه خواهد شد.
    </div>

    <button
      class="save-btn"
      onclick="saveSettings()"
    >
      💾 ذخیره تنظیمات
    </button>

  </div>


  <div class="card">

    <h2>اطلاعات سایت</h2>

    <div class="form-group">

      <label>
        نام سازنده
      </label>

      <input
        type="text"
        value="شایان محمدی"
        readonly
      >

    </div>

    <div class="form-group">

      <label>
        عنوان سایت
      </label>

      <input
        type="text"
        value="Created by SHM89"
        readonly
      >

    </div>

  </div>


  <div class="links">

    <a href="index.html" class="link-btn">
      ← پنل مدیریت
    </a>

    <a href="players.html" class="link-btn">
      👥 بازیکنان
    </a>

    <a href="matches.html" class="link-btn">
      🏓 مسابقات
    </a>

    <a href="../index.html" class="link-btn">
      🏠 صفحه اصلی
    </a>

  </div>

</main>


<footer>

  <div>© شایان محمدی</div>
  <div>Created by SHM89</div>

</footer>


<script>

  function saveSettings() {

    const name =
      document.getElementById(
        "competitionName"
      ).value;

    const type =
      document.getElementById(
        "competitionType"
      ).value;

    const winPoints =
      document.getElementById(
        "winPoints"
      ).value;

    const lossPoints =
      document.getElementById(
        "lossPoints"
      ).value;

    alert(
      "تنظیمات با موفقیت ثبت شد.\n\n" +
      "نام: " + name + "\n" +
      "نوع: " +
      (type === "league" ? "لیگ" : "حذفی") +
      "\n" +
      "امتیاز برد: " + winPoints + "\n" +
      "امتیاز باخت: " + lossPoints
    );

  }

</script>

</body>
</html>
