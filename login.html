<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title><title>TEST-123 | ورود مدیر</title></title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        header p {
            margin: 0;
        }

        .container {
            min-height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .login-box h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            direction: ltr;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            background: #fee2e2;
            color: #991b1b;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>مسابقات پینگ پونگ مدرسه</h1>
    <p>ورود به پنل مدیریت</p>
</header>

<div class="container">

    <div class="login-box">

        <h2>🔐 ورود مدیر</h2>

        <form id="loginForm">

            <label for="email">ایمیل</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <label for="password">رمز عبور</label>
            <input
                type="password"
                id="password"
                placeholder="رمز عبور"
                required
            >

            <button type="submit" id="loginButton">
                ورود به پنل مدیریت
            </button>

        </form>

        <div id="message" class="message"></div>

        <a href="index.html" class="back">
            ← بازگشت به صفحه اصلی
        </a>

    </div>

</div>

<footer>
    © شایان محمدی
    <br>
    Created by SHM89
</footer>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.style.display = "none";
        button.disabled = true;
        button.textContent = "در حال ورود...";

        if (!window.supabaseClient) {

            message.style.display = "block";
            message.textContent =
                "خطا: اتصال به Supabase برقرار نشده است.";

            button.disabled = false;
            button.textContent = "ورود به پنل مدیریت";

            return;
        }

        try {

            const { data, error } =
                await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            if (!data.session) {
                throw new Error("ورود انجام نشد. Session دریافت نشد.");
            }

            window.location.href = "admin/index.html";

        } catch (error) {

            console.error(error);

            message.style.display = "block";
            message.textContent =
                "خطا در ورود: " + error.message;

            button.disabled = false;
            button.textContent = "ورود به پنل مدیریت";
        }

    });

});

</script>

</body>
</html>
