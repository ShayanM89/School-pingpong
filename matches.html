<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مسابقات پینگ پونگ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        header p {
            margin: 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .container {
            width: 94%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .info-box {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        .info-box h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .info-box p {
            color: #666;
            line-height: 1.8;
        }

        .matches {
            display: grid;
            gap: 14px;
        }

        .match-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
            border-right: 5px solid #2563eb;
        }

        .match-card.finished {
            border-right-color: #16a34a;
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .match-number {
            font-size: 13px;
            color: #6b7280;
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status.finished {
            background: #dcfce7;
            color: #166534;
        }

        .players {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .player {
            font-size: 19px;
            font-weight: bold;
        }

        .vs {
            font-size: 14px;
            color: #888;
            font-weight: bold;
        }

        .score {
            margin-top: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .score .winner {
            color: #16a34a;
        }

        .score .loser {
            color: #555;
        }

        .waiting {
            margin-top: 15px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .nav-button {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        .nav-button:hover {
            opacity: 0.9;
        }

        .nav-button.gray {
            background: #6b7280;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #777;
            font-size: 13px;
            line-height: 2;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 21px;
            }

            .container {
                width: 92%;
            }

            .match-card {
                padding: 15px;
            }
            .players {
                gap: 8px;
            }

            .player {
                font-size: 16px;
            }

            .vs {
                font-size: 12px;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>🏓 مسابقات پینگ پونگ</h1>
    <p>مسابقات مدرسه</p>
</header>


<div class="container">

    <div class="info-box">

        <h2>📋 برنامه مسابقات</h2>

        <p>
            هر دو بازیکن دو بار با یکدیگر رقابت می‌کنند.
            <br>
            هر مسابقه فقط یک ست ۱۱ امتیازی است.
        </p>

    </div>


    <div id="matches" class="matches"></div>


    <div class="nav-buttons">

        <a href="index.html" class="nav-button">
            🏠 صفحه اصلی
        </a>

        <a href="standings.html" class="nav-button">
            🏆 جدول رده‌بندی
        </a>

    </div>

</div>


<footer>

    © شایان محمدی
    <br>
    Created by SHM89

</footer>


<script>

/*
==================================================
لیست مسابقات
==================================================

برای ثبت نتیجه فقط score1 و score2 را تغییر بده.

مثلاً:

score1: 11,
score2: 7

یعنی بازیکن اول 11 و بازیکن دوم 7 گرفته است.

اگر مسابقه هنوز برگزار نشده:
score1: null
score2: null

==================================================
*/

const matches = [

    {
        id: 1,
        player1: "شایان",
        player2: "کارن",
        score1: null,
        score2: null
    },

    {
        id: 2,
        player1: "دانیال",
        player2: "رامیار",
        score1: null,
        score2: null
    },

    {
        id: 3,
        player1: "کاروان",
        player2: "شایان",
        score1: null,
        score2: null
    },

    {
        id: 4,
        player1: "کارن",
        player2: "دانیال",
        score1: null,
        score2: null
    },

    {
        id: 5,
        player1: "رامیار",
        player2: "کاروان",
        score1: null,
        score2: null
    },

    {
        id: 6,
        player1: "شایان",
        player2: "دانیال",
        score1: null,
        score2: null
    },

    {
        id: 7,
        player1: "کارن",
        player2: "رامیار",
        score1: null,
        score2: null
    },

    {
        id: 8,
        player1: "کاروان",
        player2: "دانیال",
        score1: null,
        score2: null
    },

    {
        id: 9,
        player1: "شایان",
        player2: "رامیار",
        score1: null,
        score2: null
    },

    {
        id: 10,
        player1: "کارن",
        player2: "کاروان",
        score1: null,
        score2: null
    },

    {
        id: 11,
        player1: "کارن",
        player2: "شایان",
        score1: null,
        score2: null
    },

    {
        id: 12,
        player1: "رامیار",
        player2: "دانیال",
        score1: null,
        score2: null
    },

    {
        id: 13,
        player1: "شایان",
        player2: "کاروان",
        score1: null,
        score2: null
    },

    {
        id: 14,
        player1: "دانیال",
        player2: "کارن",
        score1: null,
        score2: null
    },

    {
        id: 15,
        player1: "کاروان",
        player2: "رامیار",
        score1: null,
        score2: null
    },

    {
        id: 16,
        player1: "دانیال",

    },

    {
        id: 17,

    },

    {

    },

    {
        id: 19,

        player2: "شایان",
        score1: null,
        score2: null
    },

    {
        id: 20,
        player1: "کاروان",
        player2: "کارن",
        score1: null,
        score2: null
    }

];


/*
==================================================
نمایش مسابقات
==================================================
*/

function showMatches() {

    const container =
        document.getElementById("matches");

    container.innerHTML = "";
    matches.forEach(match => {

        const finished =
            match.score1 !== null &&
            match.score2 !== null;


        let scoreHTML = "";

        let statusHTML = 
            <span class="status">
                برگزار نشده
            </span>
        ;


        if (finished) {

            statusHTML = 
                <span class="status finished">
                    انجام شده
                </span>
            ;


            let player1Class = "loser";
            let player2Class = "loser";


            if (match.score1 > match.score2) {

                player1Class = "winner";

            } else if (match.score2 > match.score1) {

                player2Class = "winner";

            }


            scoreHTML = 
                <div class="score">

                    <span class="${player1Class}">
                        ${match.score1}
                    </span>

                    -
                    
                    <span class="${player2Class}">
                        ${match.score2}
                    </span>

                </div>
            ;

        } else {

            scoreHTML = 
                <div class="waiting">
                    ⏳ منتظر برگزاری مسابقه
                </div>
            ;

        }


        const card = document.createElement("div");

        card.className =
            finished
                ? "match-card finished"
                : "match-card";


        card.innerHTML = 

            <div class="match-top">

                <span class="match-number">
                    مسابقه ${match.id}
                </span>

                ${statusHTML}

            </div>


            <div class="players">

                <div class="player">
                    ${match.player1}
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="player">
                    ${match.player2}
                </div>

            </div>


            ${scoreHTML}

        ;


        container.appendChild(card);

    });

}


showMatches();

</script>

</body>

</html>
