<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جدول رده‌بندی</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
    font-size:25px;
}

header p{
    margin:0;
    color:#d1d5db;
}

.container{
    width:95%;
    max-width:900px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:600px;
}

th{
    background:#2563eb;
    color:white;
    padding:14px 8px;
}

td{
    padding:13px 8px;
    text-align:center;
    border-bottom:1px solid #eee;
}

tr:first-child td{
    font-weight:bold;
}

.rank{
    font-weight:bold;
}

.points{
    font-weight:bold;
    color:#2563eb;
}

.note{
    background:white;
    margin-top:20px;
    padding:15px;
    border-radius:14px;
    line-height:2;
    text-align:center;
    color:#666;
}

footer{
    text-align:center;
    padding:30px 10px;
    color:#777;
    font-size:13px;
    line-height:2;
}

</style>

</head>

<body>

<header>

<h1>🏆 جدول رده‌بندی</h1>

<p>مسابقات پینگ پونگ مدرسه</p>

</header>


<div class="container">

<div class="card">

<table>

<thead>

<tr>

<th>رتبه</th>
<th>بازیکن</th>
<th>بازی</th>
<th>برد</th>
<th>باخت</th>
<th>امتیاز</th>

</tr>

</thead>


<tbody id="standings">

</tbody>

</table>

</div>


<div class="note">

هر برد = ۳ امتیاز
<br>
هر باخت = ۰ امتیاز
<br>
هر بازیکن در مجموع ۸ بازی انجام می‌دهد.

</div>

</div>


<footer>

© شایان محمدی
<br>
Created by SHM89

</footer>


<script>

const players = [
    "شایان",
    "کارن",
    "دانیال",
    "رامیار",
    "کاروان"
];


/*
نتایج بازی‌ها

اگر بازی برگزار نشده:
score1 و score2 برابر null هستند.

مثال:
11 - 7
یعنی بازیکن اول برنده شده.
*/

const matches = [

    {player1:"شایان", player2:"کارن", score1:null, score2:null},

    {player1:"دانیال", player2:"رامیار", score1:null, score2:null},

    {player1:"کاروان", player2:"شایان", score1:null, score2:null},

    {player1:"کارن", player2:"دانیال", score1:null, score2:null},

    {player1:"رامیار", player2:"کاروان", score1:null, score2:null},

    {player1:"شایان", player2:"دانیال", score1:null, score2:null},

    {player1:"کارن", player2:"رامیار", score1:null, score2:null},

    {player1:"کاروان", player2:"دانیال", score1:null, score2:null},

    {player1:"شایان", player2:"رامیار", score1:null, score2:null},

    {player1:"کارن", player2:"کاروان", score1:null, score2:null},

    {player1:"کارن", player2:"شایان", score1:null, score2:null},

    {player1:"رامیار", player2:"دانیال", score1:null, score2:null},

    {player1:"شایان", player2:"کاروان", score1:null, score2:null},

    {player1:"دانیال", player2:"کارن", score1:null, score2:null},

    {player1:"کاروان", player2:"رامیار", score1:null, score2:null},

    {player1:"دانیال", player2:"شایان", score1:null, score2:null},

    {player1:"رامیار", player2:"کارن", score1:null, score2:null},

    {player1:"دانیال", player2:"کاروان", score1:null, score2:null},

    {player1:"رامیار", player2:"شایان", score1:null, score2:null},

    {player1:"کاروان", player2:"کارن", score1:null, score2:null}

];


let standings = {};


players.forEach(player => {

    standings[player] = {

        played:0,
        wins:0,
        losses:0,
        points:0

    };

});


matches.forEach(match => {

    if(
        match.score1 === null ||
        match.score2 === null
    ){
        return;
    }


    standings[match.player1].played++;
    standings[match.player2].played++;


    if(match.score1 > match.score2){

        standings[match.player1].wins++;
        standings[match.player1].points += 3;

        standings[match.player2].losses++;

    }

    else if(match.score2 > match.score1){

        standings[match.player2].wins++;
        standings[match.player2].points += 3;

        standings[match.player1].losses++;

    }

});


let sorted = Object.entries(standings).sort(
    (a,b) => b[1].points - a[1].points
);


const table = document.getElementById("standings");


sorted.forEach((item,index) => {

    const player = item[0];
    const data = item[1];


    const row = document.createElement("tr");


    row.innerHTML = `

        <td class="rank">${index + 1}</td>

        <td>${player}</td>

        <td>${data.played}</td>

        <td>${data.wins}</td>

        <td>${data.losses}</td>

        <td class="points">${data.points}</td>

    `;


    table.appendChild(row);

});

</script>


</body>

</html>
